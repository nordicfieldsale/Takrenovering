# =====================================================================
#  Kör hela systemet lokalt:  docker compose up
#  Öppna sedan http://localhost:5000
#
#  Ingen .env-fil behövs. Värdena nedan är avsedda för lokala tester.
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: villa_booking
      POSTGRES_USER: villa
      POSTGRES_PASSWORD: lokaltestlosenord
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U villa -d villa_booking']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://villa:lokaltestlosenord@db:5432/villa_booking
      JWT_SECRET: lokal-testnyckel-minst-32-tecken-lang-abcdef
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: testpass123
      ADMIN_NAME: Administratör
      BOOKING_TIMEZONE: Europe/Stockholm
    ports:
      - '5000:5000'

volumes:
  db-data:
