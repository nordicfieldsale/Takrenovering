databases:
  - name: villa-db
    databaseName: villa_booking
    user: villa
    plan: free
    region: frankfurt

services:
  - type: web
    name: villa-booking
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: villa-db
          property: connectionString
      - key: PGSSL
        value: require
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BOOKING_TIMEZONE
        value: Europe/Stockholm
